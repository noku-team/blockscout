name: 'NOKU: Publish Docker image'

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Image tags
        required: false
        type: string
      platforms:
        description: Image platforms (you can specify multiple platforms separated by comma)
        required: false
        type: string
        default: linux/amd64
  workflow_call:
    inputs:
      tags:
        description: Image tags
        required: false
        type: string
      platforms:
        description: Image platforms (you can specify multiple platforms separated by comma)
        required: false
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Automatically generates tags and labels from Git refs.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/noku-team/blockscout

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: short_sha
        run: echo "value=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Debug
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "ref_type: $REF_TYPE"
          echo "ref_name: $REF_NAME"

      - name: Resolve image tags
        id: resolve_tags
        env:
          DEFAULT_IMAGE: ghcr.io/noku-team/blockscout
          INPUT_TAGS: ${{ inputs.tags }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "${INPUT_TAGS}" ]; then
            {
              echo "value<<EOF"
              printf '%s\n' "${META_TAGS}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          normalized_tags="$(
            printf '%s\n' "${INPUT_TAGS}" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | awk -v image="${DEFAULT_IMAGE}" '
                  NF {
                    if ($0 ~ /[\/]/ || $0 ~ /@sha256:/) {
                      print $0
                    } else {
                      print image ":" $0
                    }
                  }
                '
          )"

          {
            echo "value<<EOF"
            printf '%s\n' "${normalized_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.resolve_tags.outputs.value }}
          platforms: ${{ inputs.platforms }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_EXCHANGE_RATES_PERIOD=
            API_V1_READ_METHODS_DISABLED=false
            DISABLE_WEBAPP=false
            API_V1_WRITE_METHODS_DISABLED=false
            CACHE_TOTAL_GAS_USAGE_COUNTER_ENABLED=
            ADMIN_PANEL_ENABLED=false
            MIXPANEL_URL=
            MIXPANEL_TOKEN=
            AMPLITUDE_URL=
            AMPLITUDE_API_KEY=
            CACHE_ADDRESS_WITH_BALANCES_UPDATE_INTERVAL=
            BLOCKSCOUT_VERSION=v${{ vars.RELEASE_VERSION }}-beta.+commit.${{ steps.short_sha.outputs.value }}
            RELEASE_VERSION=${{ vars.RELEASE_VERSION }}
